name: Generate M3U
on:
  push:
    branches: [main]
  schedule: [{ cron: "41 */6 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Generate playlist
        run: python generate_m3u.py
      - name: Commit (incluse modifiche base.json)
        run: |
          git config user.name "ntv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || (git commit --no-verify -m "update: $(date -u +%Y-%m-%d_%H:%M)" && git push)
          
